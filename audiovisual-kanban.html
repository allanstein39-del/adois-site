:root{
  --ink:#05080F;--navy-900:#0A1628;--navy-800:#0F2340;--navy-700:#13315C;
  --navy-600:#1B4B8F;--blue-500:#2E6FB8;--blue-400:#4A91D4;--blue-300:#7CB5E6;
  --blue-200:#B9D7EE;--blue-100:#E4EEF7;--cyan-400:#2FD4E8;--cyan-200:#A8EEF6;
  --teal-500:#0FAEC5;--white:#FFFFFF;--cream:#FDFCF5;
  --bg:#05080F;--surface2:#101828;--surface3:#162033;--surface4:#1c2840;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --border-cyan:rgba(47,212,232,0.25);
  --fg-1:var(--cream);--fg-2:var(--blue-200);--fg-muted:rgba(185,215,238,0.42);
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:22px;--radius-pill:999px;
  --ease:cubic-bezier(0.2,0.8,0.2,1);--fast:160ms;--mid:240ms;
  --client-jardim:#4dcc8a;--client-hey:#ff9340;--client-igor:#b48fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BlauerNue',system-ui,sans-serif;background:var(--bg);color:var(--fg-1);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ── TOPBAR ─── */
.topbar{background:rgba(10,22,40,0.94);backdrop-filter:blur(20px) saturate(130%);border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;gap:12px;}
.topbar-left{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.logo img{height:25px;display:block;opacity:0.9;}
.top-divider{width:1px;height:20px;background:var(--border2);}
.topbar-title{font-size:12px;font-weight:300;color:var(--fg-2);letter-spacing:0.06em;white-space:nowrap;}
.topbar-center{display:flex;align-items:center;gap:5px;flex:1;justify-content:center;flex-wrap:wrap;}
.topbar-right{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.client-tab{display:flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--radius-pill);border:1px solid var(--border);background:none;font-family:'BlauerNue',sans-serif;font-size:11px;font-weight:500;color:var(--fg-muted);cursor:pointer;letter-spacing:0.04em;transition:all var(--fast) var(--ease);white-space:nowrap;}
.client-tab:hover{color:var(--fg-2);border-color:var(--border2);}
.client-tab.active{color:var(--white);border-color:transparent;}
.client-tab .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ct-all.active{background:rgba(46,111,184,0.3);border-color:var(--blue-500);}
.ct-jardim.active{background:rgba(77,204,138,0.2);border-color:var(--client-jardim);}
.ct-hey.active{background:rgba(255,147,64,0.2);border-color:var(--client-hey);}
.ct-igor.active{background:rgba(180,143,255,0.2);border-color:var(--client-igor);}

/* filter bar */
.filter-bar{display:flex;align-items:center;gap:6px;padding:10px 24px 0;flex-wrap:wrap;}
.filter-pill{display:flex;align-items:center;gap:5px;padding:5px 13px;border-radius:var(--radius-pill);border:1px solid var(--border);background:none;font-family:'BlauerNue',sans-serif;font-size:11px;font-weight:400;color:var(--fg-muted);cursor:pointer;letter-spacing:0.03em;transition:all var(--fast) var(--ease);}
.filter-pill:hover{color:var(--fg-2);border-color:var(--border2);}
.filter-pill.active{color:var(--white);border-color:transparent;}
.fp-all.active{background:rgba(46,111,184,0.25);border-color:rgba(46,111,184,0.5);}
.fp-reels.active{background:rgba(47,212,232,0.15);border-color:rgba(47,212,232,0.4);color:var(--cyan-400);}
.fp-foto.active{background:rgba(185,215,238,0.12);border-color:rgba(185,215,238,0.3);color:var(--blue-200);}
.filter-sep{width:1px;height:16px;background:var(--border);margin:0 2px;}
.filter-count{font-size:10px;color:var(--fg-muted);margin-left:4px;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:12px;height:12px;stroke:var(--fg-muted);pointer-events:none;}
.search-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 12px 6px 30px;font-family:'BlauerNue',sans-serif;font-size:12px;font-weight:300;color:var(--fg-1);outline:none;width:170px;transition:all var(--fast) var(--ease);}
.search-input::placeholder{color:var(--fg-muted);}
.search-input:focus{border-color:var(--blue-500);width:210px;}
.btn-fluxo{display:flex;align-items:center;gap:6px;background:rgba(47,212,232,0.08);border:1px solid var(--border-cyan);border-radius:var(--radius-pill);padding:6px 14px;font-family:'BlauerNue',sans-serif;font-size:11px;font-weight:500;color:var(--cyan-400);cursor:pointer;text-decoration:none;transition:all var(--fast) var(--ease);letter-spacing:0.03em;white-space:nowrap;}
.btn-fluxo:hover{background:rgba(47,212,232,0.16);border-color:var(--cyan-400);}
.btn-fluxo svg{width:12px;height:12px;stroke-width:1.5;}
.btn-novo{display:flex;align-items:center;gap:6px;background:var(--blue-500);border:none;border-radius:var(--radius-pill);padding:7px 16px;font-family:'BlauerNue',sans-serif;font-size:11px;font-weight:500;color:var(--white);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.03em;white-space:nowrap;}
.btn-novo:hover{background:var(--blue-400);box-shadow:0 0 18px rgba(46,111,184,0.5);}
.btn-novo svg{width:12px;height:12px;stroke-width:2;}

/* stats bar */
.stats-bar{display:flex;align-items:center;gap:20px;padding:9px 24px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.stat{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.stat-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-muted);}
.stat-val{font-size:13px;font-weight:500;color:var(--fg-2);font-variant-numeric:tabular-nums;}
.stat-sep{width:1px;height:14px;background:var(--border);}

/* board */
.board-wrap{overflow-x:auto;}
.board{display:flex;gap:12px;padding:16px 24px 48px;min-width:max-content;align-items:flex-start;}

/* column */
.column{width:272px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 148px);}
.col-header{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:7px;}
.col-indicator{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.col-label{font-size:10px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-2);flex:1;}
.col-count{font-size:10px;color:var(--fg-muted);background:var(--surface2);border:1px solid var(--border);padding:2px 7px;border-radius:var(--radius-pill);font-variant-numeric:tabular-nums;}
.col-body{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;padding:1px 2px 1px 1px;}
.col-body::-webkit-scrollbar{width:3px;}
.col-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* card */
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 14px 11px;cursor:grab;position:relative;overflow:hidden;transition:border-color var(--fast) var(--ease),transform var(--fast) var(--ease),box-shadow var(--fast) var(--ease);}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--col-color,var(--blue-500));opacity:0.65;border-radius:3px 0 0 3px;}
.card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(5,8,15,0.55);}
.card:active{cursor:grabbing;transform:scale(0.98);}
.card.hidden{display:none;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px;}
.card-title{font-size:13px;font-weight:400;color:var(--fg-1);line-height:1.45;flex:1;word-break:break-word;}
.card-actions{display:none;align-items:center;gap:3px;flex-shrink:0;}
.card:hover .card-actions{display:flex;}
.icon-btn{width:23px;height:23px;border-radius:var(--radius-sm);background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);transition:all var(--fast) var(--ease);}
.icon-btn svg{width:11px;height:11px;stroke-width:1.5;}
.icon-btn:hover{background:var(--border2);color:var(--fg-1);}
.icon-btn.danger:hover{background:rgba(255,80,80,0.15);color:#ff5c5c;border-color:rgba(255,80,80,0.25);}

/* tipo toggle */
.tipo-toggle{display:flex;gap:8px;}
.tipo-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 0;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface3);font-family:'BlauerNue',sans-serif;font-size:12px;font-weight:400;color:var(--fg-muted);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.03em;}
.tipo-btn:hover{border-color:var(--border2);color:var(--fg-2);}
.tipo-btn .tipo-icon{width:16px;height:16px;stroke-width:1.5;flex-shrink:0;}
.tipo-btn.active-reels{background:rgba(47,212,232,0.12);border-color:rgba(47,212,232,0.35);color:var(--cyan-400);}
.tipo-btn.active-foto{background:rgba(185,215,238,0.1);border-color:rgba(185,215,238,0.3);color:var(--blue-200);}

/* card tags */
.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center;}
.tag{font-size:10px;font-weight:500;letter-spacing:0.03em;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;border:1px solid transparent;}
.tag-reels{background:rgba(47,212,232,0.1);color:var(--cyan-400);border-color:rgba(47,212,232,0.2);}
.tag-foto{background:rgba(185,215,238,0.1);color:var(--blue-200);border-color:rgba(185,215,238,0.18);}
.tag-both{background:rgba(185,215,238,0.08);color:var(--blue-200);border-color:rgba(185,215,238,0.18);}
.tag-resp{background:rgba(46,111,184,0.1);color:var(--blue-300);border-color:rgba(46,111,184,0.18);}
.tag-client-jardim{background:rgba(77,204,138,0.12);color:var(--client-jardim);border-color:rgba(77,204,138,0.22);}
.tag-client-hey{background:rgba(255,147,64,0.12);color:var(--client-hey);border-color:rgba(255,147,64,0.22);}
.tag-client-igor{background:rgba(180,143,255,0.12);color:var(--client-igor);border-color:rgba(180,143,255,0.22);}
.due-chip{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--fg-muted);background:var(--surface3);border:1px solid var(--border);padding:2px 8px;border-radius:var(--radius-pill);}
.due-chip svg{width:9px;height:9px;stroke-width:1.5;}
.due-late{color:#ff7070;background:rgba(255,80,80,0.1);border-color:rgba(255,80,80,0.2);}
.due-soon{color:#ffb340;background:rgba(255,147,64,0.1);border-color:rgba(255,147,64,0.2);}

/* ── CARD LINKS AREA ─── */
.card-links{display:flex;flex-direction:column;gap:0;margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.card-link-row{display:flex;align-items:center;gap:6px;padding:4px 0;}
.card-link-row + .card-link-row{border-top:1px solid var(--border);}
.link-icon{width:14px;height:14px;flex-shrink:0;opacity:0.6;}
.link-label{font-size:10px;color:var(--fg-muted);letter-spacing:0.04em;text-transform:uppercase;font-weight:500;flex-shrink:0;min-width:34px;}
.link-anchor{font-size:10px;color:var(--blue-300);text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;transition:color var(--fast);}
.link-anchor:hover{color:var(--cyan-400);}
/* ajuste link row — highlighted */
.card-link-row.has-docs .link-label{color:rgba(255,147,64,0.85);}
.card-link-row.has-docs .link-anchor{color:rgba(255,147,64,0.85);}
.card-link-row.has-docs .link-anchor:hover{color:var(--client-hey);}
.card-link-row.has-docs .link-icon{opacity:0.8;color:var(--client-hey);}

.add-adj-btn{margin-top:9px;width:100%;background:none;border:1px dashed var(--border);border-radius:var(--radius-sm);padding:5px 10px;font-family:'BlauerNue',sans-serif;font-size:10px;letter-spacing:0.04em;color:var(--fg-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all var(--fast) var(--ease);}
.add-adj-btn svg{width:9px;height:9px;stroke-width:2;}
.add-adj-btn:hover{border-color:var(--border-cyan);color:var(--cyan-400);}
.empty-col{text-align:center;padding:22px 10px;color:var(--fg-muted);font-size:11px;letter-spacing:0.04em;border:1px dashed var(--border);border-radius:var(--radius-lg);}
.col-drop-active .col-body{outline:1.5px dashed rgba(47,212,232,0.4);outline-offset:-2px;border-radius:var(--radius-md);}

/* ── MODAL ─── */
.overlay{display:none;position:fixed;inset:0;background:rgba(5,8,15,0.88);backdrop-filter:blur(10px);z-index:500;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-xl);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;}
.modal-header{padding:20px 22px 0;flex-shrink:0;}
.modal-header h2{font-size:14px;font-weight:400;color:var(--fg-1);letter-spacing:-0.01em;}

/* modal tabs */
.modal-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-top:16px;}
.modal-tab{padding:10px 18px;font-family:'BlauerNue',sans-serif;font-size:11px;font-weight:400;color:var(--fg-muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:0.04em;transition:all var(--fast) var(--ease);display:flex;align-items:center;gap:6px;}
.modal-tab svg{width:12px;height:12px;stroke-width:1.5;}
.modal-tab:hover{color:var(--fg-2);}
.modal-tab.active{color:var(--fg-1);border-bottom-color:var(--blue-500);}
.modal-tab.tab-docs.active{color:var(--client-hey);border-bottom-color:var(--client-hey);}
.modal-tab.tab-briefing.active{color:#a78bfa;border-bottom-color:#a78bfa;}
.briefing-textarea{width:100%;min-height:200px;resize:vertical;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--fg-1);font-size:13px;padding:12px;font-family:inherit;line-height:1.65;box-sizing:border-box;}
.briefing-textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(46,111,184,0.15);outline:none;}
.video-count-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.video-count-row label{font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.video-count-row select{width:auto;min-width:110px;}
.video-dates-list{display:flex;flex-direction:column;gap:7px;}
.video-date-row{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;align-items:center;}
.video-date-num{font-size:11px;color:var(--fg-muted);font-weight:600;}

/* modal panels */
.modal-panel{display:none;padding:18px 22px 22px;}
.modal-panel.active{display:block;}

.modal-close-row{display:flex;justify-content:flex-end;margin-bottom:4px;}
.modal-close{background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);transition:all var(--fast);}
.modal-close svg{width:12px;height:12px;stroke-width:1.5;}
.modal-close:hover{background:var(--border2);color:var(--fg-1);}

.field{margin-bottom:13px;}
.field label{display:block;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 12px;font-family:'BlauerNue',sans-serif;font-size:12px;font-weight:300;color:var(--fg-1);outline:none;transition:border-color var(--fast) var(--ease);-webkit-appearance:none;}
.field input::placeholder,.field textarea::placeholder{color:var(--fg-muted);}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(46,111,184,0.15);}
.field textarea{resize:vertical;min-height:70px;line-height:1.5;}
.field select option{background:var(--surface3);color:var(--fg-1);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* docs list in modal */
.docs-list{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.docs-item{background:rgba(255,147,64,0.05);border:1px solid rgba(255,147,64,0.18);border-radius:var(--radius-md);padding:10px 12px;display:flex;align-items:flex-start;gap:10px;}
.docs-item-body{flex:1;min-width:0;}
.docs-item-label{font-size:11px;font-weight:500;color:rgba(255,147,64,0.9);margin-bottom:4px;letter-spacing:0.02em;}
.docs-item-url{font-size:10px;color:var(--fg-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.docs-item-url a{color:rgba(255,147,64,0.7);text-decoration:none;}
.docs-item-url a:hover{color:var(--client-hey);}
.docs-item-actions{display:flex;gap:4px;flex-shrink:0;}
.docs-del{background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:15px;line-height:1;padding:0;transition:color var(--fast);}
.docs-del:hover{color:#ff5c5c;}

.docs-add-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:end;margin-top:12px;}
.docs-add-row .field{margin-bottom:0;}
.docs-add-btn{background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 14px;font-family:'BlauerNue',sans-serif;font-size:11px;font-weight:500;color:var(--cyan-400);cursor:pointer;white-space:nowrap;transition:all var(--fast) var(--ease);height:38px;display:flex;align-items:center;}
.docs-add-btn:hover{background:rgba(47,212,232,0.1);border-color:var(--cyan-400);}

.docs-empty{text-align:center;padding:28px 0;font-size:11px;color:var(--fg-muted);letter-spacing:0.04em;}
.docs-empty svg{width:28px;height:28px;stroke-width:1;margin:0 auto 10px;display:block;opacity:0.3;}

/* modal footer */
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 20px;border-top:1px solid var(--border);flex-shrink:0;}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:var(--radius-pill);padding:8px 18px;font-family:'BlauerNue',sans-serif;font-size:11px;color:var(--fg-2);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.03em;}
.btn-cancel:hover{border-color:var(--border2);color:var(--fg-1);}
.btn-save{background:var(--blue-500);border:none;border-radius:var(--radius-pill);padding:8px 22px;font-family:'BlauerNue',sans-serif;font-size:11px;font-weight:500;color:var(--white);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.04em;}
.btn-save:hover{background:var(--blue-400);box-shadow:0 0 16px rgba(46,111,184,0.45);}

/* history */
.history-overlay{display:none;position:fixed;inset:0;z-index:400;}
.history-overlay.open{display:block;}
.history-panel{position:fixed;right:0;top:0;bottom:0;width:310px;background:var(--surface2);border-left:1px solid var(--border2);display:flex;flex-direction:column;z-index:401;transform:translateX(100%);transition:transform var(--mid) var(--ease);}
.history-overlay.open .history-panel{transform:translateX(0);}
.history-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.history-header h3{font-size:13px;font-weight:400;color:var(--fg-1);}
.history-body{flex:1;overflow-y:auto;padding:12px 16px;}
.history-body::-webkit-scrollbar{width:3px;}
.history-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.hist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.hist-dot.moved{background:var(--cyan-400);}
.hist-dot.created{background:var(--client-jardim);}
.hist-dot.edited{background:var(--blue-300);}
.hist-dot.deleted{background:#ff5c5c;}
.hist-content{flex:1;}
.hist-msg{font-size:12px;color:var(--fg-2);line-height:1.5;}
.hist-time{font-size:10px;color:var(--fg-muted);margin-top:2px;}
.hist-empty{text-align:center;padding:32px 16px;font-size:11px;color:var(--fg-muted);letter-spacing:0.04em;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-pill);padding:9px 18px;font-size:11px;color:var(--fg-2);z-index:9999;opacity:0;transition:all var(--mid) var(--ease);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sphere-deco{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#B9D7EE 0%,#4A91D4 35%,#13315C 75%,#0A1628 100%);opacity:0.04;bottom:-90px;right:-70px;pointer-events:none;z-index:0;}

@media(max-width:768px){
  .board{flex-direction:column;min-width:unset;padding:12px;gap:10px;}
  .column{width:100%;max-height:none;}
  .topbar-center{display:none;}
  .search-input{width:110px;}
  .field-row{grid-template-columns:1fr;}
  .docs-add-row{grid-template-columns:1fr;}
  .history-panel{width:100%;}
}
</style>

function addHist(type,msg){
  var ts=Date.now();
  hist.unshift({type:type,msg:msg,time:ts});
  if(hist.length>150)hist=hist.slice(0,120);
  _sb.from('kanban_hist').insert({type:type,msg:msg,ts:ts}).then(function(){});
}

async function loadData(){
  var res=await _sb.from('kanban_cards').select('*');
  var hres=await _sb.from('kanban_hist').select('*').order('id',{ascending:false}).limit(150);
  cards=(res.data||[]).map(_rowToCard);
  hist=(hres.data||[]).map(function(h){return{type:h.type,msg:h.msg,time:h.ts};});
  renderBoard();
  _sb.channel('kanban-rt').on('postgres_changes',{event:'*',schema:'public',table:'kanban_cards'},function(payload){
    if(payload.eventType==='INSERT'||payload.eventType==='UPDATE'){
      var nc=_rowToCard(payload.new);
      var idx=cards.findIndex(function(c){return c.id===nc.id;});
      if(idx>=0)cards[idx]=nc; else cards.push(nc);
    } else if(payload.eventType==='DELETE'){
      cards=cards.filter(function(c){return c.id!==payload.old.id;});
    }
    renderBoard();
  }).subscribe();
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(function(){t.classList.remove('show');},2200);}
function fmtDate(d){if(!d)return null;var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function dueStatus(d,t){
  if(!d)return'';
  var dl=new Date(d+'T'+(t||'23:59'));var now=new Date();var diff=(dl-now)/(3600000);
  if(diff<0)return'late';if(diff<24)return'soon';return'ok';
}
function relTime(ts){
  var diff=Math.round((Date.now()-ts)/1000);
  if(diff<60)return'agora';if(diff<3600)return Math.round(diff/60)+'min atras';
  if(diff<86400)return Math.round(diff/3600)+'h atras';return Math.round(diff/86400)+'d atras';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function truncUrl(u){try{var p=new URL(u);return(p.hostname+p.pathname).replace(/\/$/,'').substring(0,32)+'...';}catch(e){return String(u).substring(0,32)+'...';}}

function toggleTipo(t){
  if(modalTipo===t&&modalTipo!=='both'){modalTipo=t;}
  else if(modalTipo==='both'){modalTipo=(t==='reels')?'foto':'reels';}
  else if(modalTipo!==t){modalTipo='both';}
  else{modalTipo=t;}
  renderTipoToggle();
}
function renderTipoToggle(){
  var br=document.getElementById('btn-reels');
  var bf=document.getElementById('btn-foto');
  br.className='tipo-btn'+((modalTipo==='reels'||modalTipo==='both')?' active-reels':'');
  bf.className='tipo-btn'+((modalTipo==='foto'||modalTipo==='both')?' active-foto':'');
}
function tipoLabel(t){if(t==='reels')return'Reels';if(t==='foto')return'Foto';if(t==='both')return'Reels + Foto';return'';}
function tipoCls(t){if(t==='reels')return'tag-reels';if(t==='foto')return'tag-foto';return'tag-both';}

/* ── VIDEO DATES ─── */
function renderVideoDates(){
  var count=parseInt(document.getElementById('f-video-count').value)||1;
  var container=document.getElementById('video-dates');
  // preserve existing values
  var existing=[];
  container.querySelectorAll('.video-date-row').forEach(function(row,i){
    existing[i]={due:row.querySelector('.vd-date').value,time:row.querySelector('.vd-time').value};
  });
  container.innerHTML='';
  for(var i=0;i<count;i++){
    var row=document.createElement('div');
    row.className='video-date-row';
    var prev=existing[i]||{due:'',time:''};
    row.innerHTML='<span class="video-date-num">video '+(i+1)+'</span>'
      +'<input class="vd-date" type="date" value="'+esc(prev.due||'')+'" />'
      +'<input class="vd-time" type="time" value="'+esc(prev.time||'')+'" />';
    container.appendChild(row);
  }
}
function collectVideos(){
  var rows=document.getElementById('video-dates').querySelectorAll('.video-date-row');
  var result=[];
  rows.forEach(function(row){
    result.push({due:row.querySelector('.vd-date').value,time:row.querySelector('.vd-time').value});
  });
  return result;
}

/* ── FILTERS ─── */
function cardVisible(card){
  if(activeClient!=='all'&&card.client!==activeClient)return false;
  if(activeType==='reels'&&card.tipo!=='reels'&&card.tipo!=='both')return false;
  if(activeType==='foto'&&card.tipo!=='foto'&&card.tipo!=='both')return false;
  if(searchQ){
    var q=searchQ.toLowerCase();
    var hay=(card.title+' '+(card.resp||'')+' '+(card.client||'')).toLowerCase();
    if(hay.indexOf(q)===-1)return false;
  }
  return true;
}
function setClient(c){
  activeClient=c;
  document.querySelectorAll('.client-tab').forEach(function(b){b.classList.toggle('active',b.dataset.client===c);});
  applyFilters();
}
function setType(t){
  activeType=t;
  document.querySelectorAll('.filter-pill').forEach(function(b){b.classList.toggle('active',b.dataset.type===t);});
  applyFilters();
}
function applyFilters(){
  searchQ=document.getElementById('search-input').value.trim();
  var vis=0;
  cards.forEach(function(c){
    var el=document.querySelector('.card[data-id="'+c.id+'"]');
    if(el){var show=cardVisible(c);el.classList.toggle('hidden',!show);if(show)vis++;}
  });
  document.getElementById('filter-count').textContent=vis+' card'+(vis!==1?'s':'');
  updateStats();updateColCounts();
}
function updateColCounts(){
  COLS.forEach(function(col){
    var count=cards.filter(function(c){return c.col===col.id&&cardVisible(c);}).length;
    var el=document.querySelector('#col-count-'+col.id);
    if(el)el.textContent=count;
    var body=document.getElementById('cb-'+col.id);
    if(body){
      var emp=body.querySelector('.empty-col');
      if(count===0&&!emp){var d=document.createElement('div');d.className='empty-col';d.textContent='nenhum card';body.appendChild(d);}
      else if(count>0&&emp)emp.remove();
    }
  });
}
function updateStats(){
  var vis=cards.filter(cardVisible);
  document.getElementById('stat-total').textContent=vis.length;
  document.getElementById('stat-late').textContent=vis.filter(function(c){return dueStatus(c.due,c.time)==='late';}).length;
  document.getElementById('stat-approved').textContent=vis.filter(function(c){return c.col==='aprovado';}).length;
  document.getElementById('stat-pending').textContent=vis.filter(function(c){return c.col==='aprovacao';}).length;
  document.getElementById('stat-docs').textContent=vis.filter(function(c){return c.docs&&c.docs.length>0;}).length;
}

/* ── BOARD ─── */
function renderBoard(){
  var board=document.getElementById('board');board.innerHTML='';
  COLS.forEach(function(col){
    var colCards=cards.filter(function(c){return c.col===col.id;});
    var wrap=document.createElement('div');wrap.className='column';
    wrap.innerHTML='<div class="col-header"><div class="col-indicator" style="background:'+col.color+'"></div><span class="col-label">'+col.label+'</span><span class="col-count" id="col-count-'+col.id+'">'+colCards.length+'</span></div><div class="col-body" id="cb-'+col.id+'"></div>';
    board.appendChild(wrap);
    var body=wrap.querySelector('.col-body');
    setupDrop(body,col.id,wrap);
    colCards.forEach(function(card){body.appendChild(buildCard(card,col.color));});
    if(colCards.length===0){var d=document.createElement('div');d.className='empty-col';d.textContent='nenhum card';body.appendChild(d);}
  });
  applyFilters();
}

function buildCard(card,colColor){

  el.className='card';el.draggable=true;el.dataset.id=card.id;

  var ds=dueStatus(nearestDue,nearestTime);

  /* due chip */

  if(nearestDue){
    var dc=ds==='late'?' due-late':ds==='soon'?' due-soon':'';

    var vcLabel=vids.length>1?' ('+vids.length+' vids)':'';
    dueHtml='<span class="due-chip'+dc+'"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>'+dl+vcLabel+'</span>';
  }

  /* links block: drive + docs */
  var linksHtml='';
  var hasLinks=(card.drive||(card.docs&&card.docs.length));
  if(hasLinks){
    linksHtml='<div class="card-links">';
    if(card.drive){
      linksHtml+='<div class="card-link-row">'
        +'<svg class="link-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg>'
        +'<span class="link-label">drive</span>'
        +'<a class="link-anchor" href="'+esc(card.drive)+'" target="_blank" rel="noopener">'+esc(truncUrl(card.drive))+'</a>'
        +'</div>';
    }
    if(card.docs&&card.docs.length){
      card.docs.forEach(function(d){
        linksHtml+='<div class="card-link-row has-docs">'
          +'<svg class="link-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="color:var(--client-hey)"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>'
          +'<span class="link-label">ajuste</span>'
          +'<a class="link-anchor" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.label||truncUrl(d.url))+'</a>'
          +'</div>';
      });
    }
    linksHtml+='</div>';
  }

  el.innerHTML='<div class="card-top"><div class="card-title">'+esc(card.title)+'</div>'
    +'<div class="card-actions">'
    +'<button class="icon-btn" onclick="openModal(\''+card.id+'\')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897z"/></svg></button>'
    +'<button class="icon-btn danger" onclick="delCard(\''+card.id+'\')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg></button>'
    +'</div></div>'
    +'<div class="card-meta"><span class="tag '+cli.cls+'">'+cli.label+'</span><span class="tag '+tipoCls(tipo)+'">'+tipoLabel(tipo)+'</span>'
    +(card.resp?'<span class="tag tag-resp">'+esc(card.resp)+'</span>':'')
    +(card.briefing?'<span class="tag" style="background:rgba(167,139,250,0.1);color:#a78bfa;border-color:rgba(167,139,250,0.2)">briefing</span>':'')

function setupDrop(body,colId,wrap){
  body.addEventListener('dragover',function(e){e.preventDefault();wrap.classList.add('col-drop-active');});
  body.addEventListener('dragleave',function(e){if(!wrap.contains(e.relatedTarget))wrap.classList.remove('col-drop-active');});
  body.addEventListener('drop',function(e){
    e.preventDefault();wrap.classList.remove('col-drop-active');
    if(dragId){
      var c=cards.find(function(x){return x.id===dragId;});
      if(c&&c.col!==colId){
        var cl=COLS.find(function(x){return x.id===colId;});
        c.col=colId;_sb.from('kanban_cards').upsert(_cardToRow(c)).then(function(){});addHist('moved','['+esc(c.title)+'] movido para '+cl.label);
        renderBoard();toast('card movido');
      }
    }
  });
}

/* ── OPEN MODAL ─── */
function openModal(id,startTab){
  editingId=id||null;modalDocs=[];
  var colSel=document.getElementById('f-col');
  colSel.innerHTML=COLS.map(function(c){return'<option value="'+c.id+'">'+c.label+'</option>';}).join('');
  if(id){
    var card=cards.find(function(c){return c.id===id;});
    document.getElementById('modal-title').textContent='editar card';
    document.getElementById('f-title').value=card.title||'';
    document.getElementById('f-resp').value=card.resp||'';
    document.getElementById('f-client').value=card.client||'jardim';
    document.getElementById('f-col').value=card.col||'briefing';
    document.getElementById('f-drive').value=card.drive||'';
    document.getElementById('f-briefing').value=card.briefing||'';
    modalTipo=card.tipo||'reels';
    modalDocs=[].concat((card.docs||[]).map(function(d){return{label:d.label,url:d.url};}));
    // load videos
    var vids=card.videos&&card.videos.length?card.videos:[{due:card.due||'',time:card.time||''}];
    document.getElementById('f-video-count').value=vids.length;
    renderVideoDates();
    // set saved values
    var rows=document.getElementById('video-dates').querySelectorAll('.video-date-row');
    rows.forEach(function(row,i){
      if(vids[i]){row.querySelector('.vd-date').value=vids[i].due||'';row.querySelector('.vd-time').value=vids[i].time||'';}
    });
  }else{
    document.getElementById('modal-title').textContent='novo conteudo';
    ['f-title','f-resp','f-drive'].forEach(function(i){document.getElementById(i).value='';});
    document.getElementById('f-briefing').value='';
    document.getElementById('f-client').value=activeClient!=='all'?activeClient:'jardim';
    document.getElementById('f-col').value='briefing';
    document.getElementById('f-video-count').value='1';
    renderVideoDates();
    modalTipo='reels';modalDocs=[];
  }
  renderTipoToggle();renderDocsList();updateDocsBadge();
  switchTab(startTab||'info');
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){document.getElementById('f-title').focus();},60);
}
function openDocsModal(id){openModal(id,'docs');}
function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;modalDocs=[];modalVideos=[];}

function saveCard(){
  var title=document.getElementById('f-title').value.trim();
  if(!title){switchTab('info');document.getElementById('f-title').focus();return;}
  var vids=collectVideos();
  var data={
    title:title,
    resp:document.getElementById('f-resp').value.trim(),
    tipo:modalTipo,
    client:document.getElementById('f-client').value,
    col:document.getElementById('f-col').value,
    due:(vids[0]&&vids[0].due)||'',
    time:(vids[0]&&vids[0].time)||'',
    drive:document.getElementById('f-drive').value.trim(),
    docs:[].concat(modalDocs),
    briefing:document.getElementById('f-briefing').value,
    videos:vids,
  };
  if(editingId){
    var i=cards.findIndex(function(c){return c.id===editingId;});
    if(i>=0){cards[i]=Object.assign({},cards[i],data);_sb.from('kanban_cards').upsert(_cardToRow(cards[i])).then(function(){});}
    addHist('edited','['+esc(title)+'] editado');toast('card atualizado');
  }else{
    var nc=Object.assign({id:Date.now().toString()},data);
    cards.push(nc);
    _sb.from('kanban_cards').insert(_cardToRow(nc)).then(function(){});
    addHist('created','['+esc(title)+'] criado');toast('card criado');
  }
  renderBoard();closeModal();
}
function delCard(id){
  if(!confirm('excluir este card?'))return;
  var c=cards.find(function(x){return x.id===id;});
  if(c)addHist('deleted','['+esc(c.title)+'] excluido');
  cards=cards.filter(function(c){return c.id!==id;});
  _sb.from('kanban_cards').delete().eq('id',id).then(function(){});
  renderBoard();toast('card removido');
}

function closeHistory(e){if(e.target===document.getElementById('hist-overlay'))document.getElementById('hist-overlay').classList.remove('open');}
function renderHistory(){
  var body=document.getElementById('hist-body');
  if(!hist.length){body.innerHTML='<div class="hist-empty">nenhuma alteracao ainda</div>';return;}
  body.innerHTML=hist.map(function(h){return'<div class="hist-item"><div class="hist-dot '+h.type+'"></div><div class="hist-content"><div class="hist-msg">'+esc(h.msg)+'</div><div class="hist-time">'+relTime(h.time)+'</div></div></div>';}).join('');
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
loadData();
</script>
