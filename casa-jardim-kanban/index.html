<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>adois · casa jardim</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

:root {
  --ink:#050810;--surface1:#090d18;--surface2:#0e1425;--surface3:#141a2e;
  --border:#1e2840;--border2:#2a3655;--border-cyan:rgba(47,212,232,0.3);
  --fg-1:#e8eaf0;--fg-2:#a8b0c8;--fg-muted:#5a6480;--white:#ffffff;
  --blue-200:#b9d7ee;--blue-300:#7aabdb;--blue-400:#4a91d4;--blue-500:#2e6fb8;
  --cyan-400:#2fd4e8;--cyan-500:#1ab8cc;
  --client-jardim:#4dcc8a;--client-hey:#ff9340;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-pill:99px;
  --fast:120ms;--mid:250ms;--ease:cubic-bezier(.4,0,.2,1);
  --col-min:260px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--ink);color:var(--fg-1);font-family:'Inter',sans-serif;font-size:13px;font-weight:300;-webkit-font-smoothing:antialiased;}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;}

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* TOPBAR */
.topbar{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:100;background:var(--surface1);backdrop-filter:blur(12px);}
.topbar-logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:26px;height:26px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--blue-500),var(--cyan-400));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-mark svg{width:14px;height:14px;stroke:var(--white);stroke-width:2;}
.logo-title{font-size:13px;font-weight:400;color:var(--fg-1);letter-spacing:-0.01em;}
.logo-sep{width:1px;height:16px;background:var(--border2);}
.logo-sub{font-size:11px;color:var(--fg-muted);letter-spacing:0.06em;text-transform:uppercase;}

.client-tabs{display:flex;gap:4px;margin-left:auto;}
.client-tab{padding:5px 14px;border-radius:var(--radius-pill);border:1px solid var(--border);background:none;font-family:inherit;font-size:11px;color:var(--fg-muted);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.03em;}
.client-tab:hover{border-color:var(--border2);color:var(--fg-2);}
.client-tab.active[data-client="all"]{background:rgba(46,111,184,0.15);border-color:var(--blue-500);color:var(--blue-200);}
.client-tab.active[data-client="jardim"]{background:rgba(77,204,138,0.12);border-color:rgba(77,204,138,0.3);color:var(--client-jardim);}
.client-tab.active[data-client="hey"]{background:rgba(255,147,64,0.12);border-color:rgba(255,147,64,0.3);color:var(--client-hey);}

.topbar-actions{display:flex;gap:8px;align-items:center;margin-left:12px;}

.btn-history{width:32px;height:32px;border-radius:var(--radius-md);background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);transition:all var(--fast) var(--ease);}
.btn-history svg{width:14px;height:14px;stroke-width:1.5;}
.btn-history:hover{background:var(--border2);color:var(--fg-1);}

.btn-novo{height:32px;padding:0 16px;border-radius:var(--radius-pill);background:var(--blue-500);border:none;font-family:inherit;font-size:11px;font-weight:500;color:var(--white);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all var(--fast) var(--ease);letter-spacing:0.03em;}
.btn-novo svg{width:12px;height:12px;stroke-width:2;}
.btn-novo:hover{background:var(--blue-400);box-shadow:0 0 16px rgba(46,111,184,0.4);}

/* FILTER BAR */
.filter-bar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--surface1);}
.filter-pill{padding:4px 12px;border-radius:var(--radius-pill);border:1px solid var(--border);background:none;font-family:inherit;font-size:10px;color:var(--fg-muted);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.04em;}
.filter-pill:hover{border-color:var(--border2);color:var(--fg-2);}
.fp-all.active{background:rgba(46,111,184,0.12);border-color:var(--blue-500);color:var(--blue-200);}
.fp-reels.active{background:rgba(47,212,232,0.1);border-color:rgba(47,212,232,0.3);color:var(--cyan-400);}
.fp-foto.active{background:rgba(185,215,238,0.1);border-color:rgba(185,215,238,0.25);color:var(--blue-200);}
.filter-sep{width:1px;height:16px;background:var(--border);margin:0 2px;}
.filter-count{font-size:10px;color:var(--fg-muted);letter-spacing:0.06em;margin-left:4px;}
.search-input{margin-left:auto;height:28px;padding:0 10px;border-radius:var(--radius-pill);background:var(--surface3);border:1px solid var(--border);font-family:inherit;font-size:11px;color:var(--fg-1);outline:none;width:160px;transition:all var(--fast) var(--ease);}
.search-input::placeholder{color:var(--fg-muted);}
.search-input:focus{border-color:var(--border-cyan);box-shadow:0 0 0 2px rgba(47,212,232,0.1);}

/* STATS */
.stats-bar{padding:8px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-shrink:0;background:var(--surface1);}
.stat{display:flex;align-items:baseline;gap:6px;}
.stat-label{font-size:10px;color:var(--fg-muted);letter-spacing:0.06em;text-transform:uppercase;}
.stat-val{font-size:16px;font-weight:300;color:var(--fg-1);}
.stat-sep{width:1px;height:20px;background:var(--border);}

/* BOARD */
.board-wrap{flex:1;overflow-x:auto;padding:20px;padding-bottom:40px;}
.board{display:flex;gap:14px;align-items:flex-start;min-width:max-content;}
.column{width:var(--col-min);flex-shrink:0;display:flex;flex-direction:column;gap:0;}
.col-header{display:flex;align-items:center;gap:8px;padding:0 4px 10px;flex-shrink:0;}
.col-indicator{width:3px;height:14px;border-radius:2px;flex-shrink:0;}
.col-label{font-size:11px;font-weight:400;color:var(--fg-2);letter-spacing:0.03em;flex:1;}
.col-count{font-size:10px;color:var(--fg-muted);background:var(--surface3);border:1px solid var(--border);padding:1px 7px;border-radius:var(--radius-pill);}
.col-body{display:flex;flex-direction:column;gap:8px;min-height:80px;padding:2px 2px 8px;}

/* CARD */
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;cursor:grab;transition:box-shadow var(--fast) var(--ease),border-color var(--fast) var(--ease);position:relative;border-top:2px solid var(--col-color,var(--border));}
.card:hover{border-color:var(--border2);box-shadow:0 4px 24px rgba(0,0,0,0.4);}
.card.hidden{display:none;}
.card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;}
.card-title{font-size:12px;font-weight:400;color:var(--fg-1);line-height:1.45;flex:1;}
.card-actions{display:none;align-items:center;gap:3px;flex-shrink:0;}
.card:hover .card-actions{display:flex;}
.icon-btn{width:23px;height:23px;border-radius:var(--radius-sm);background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);transition:all var(--fast) var(--ease);}
.icon-btn svg{width:11px;height:11px;stroke-width:1.5;}
.icon-btn:hover{background:var(--border2);color:var(--fg-1);}
.icon-btn.danger:hover{background:rgba(255,80,80,0.15);color:#ff5c5c;border-color:rgba(255,80,80,0.25);}

/* tipo toggle */
.tipo-toggle{display:flex;gap:8px;}
.tipo-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 0;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface3);font-family:inherit;font-size:12px;font-weight:400;color:var(--fg-muted);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.03em;}
.tipo-btn:hover{border-color:var(--border2);color:var(--fg-2);}
.tipo-btn .tipo-icon{width:16px;height:16px;stroke-width:1.5;flex-shrink:0;}
.tipo-btn.active-reels{background:rgba(47,212,232,0.12);border-color:rgba(47,212,232,0.35);color:var(--cyan-400);}
.tipo-btn.active-foto{background:rgba(185,215,238,0.1);border-color:rgba(185,215,238,0.3);color:var(--blue-200);}

/* card tags */
.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center;}
.tag{font-size:10px;font-weight:500;letter-spacing:0.03em;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;border:1px solid transparent;}
.tag-reels{background:rgba(47,212,232,0.1);color:var(--cyan-400);border-color:rgba(47,212,232,0.2);}
.tag-foto{background:rgba(185,215,238,0.1);color:var(--blue-200);border-color:rgba(185,215,238,0.18);}
.tag-both{background:rgba(185,215,238,0.08);color:var(--blue-200);border-color:rgba(185,215,238,0.18);}
.tag-client-jardim{background:rgba(77,204,138,0.12);color:var(--client-jardim);border-color:rgba(77,204,138,0.22);}
.tag-client-hey{background:rgba(255,147,64,0.12);color:var(--client-hey);border-color:rgba(255,147,64,0.22);}
.due-chip{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--fg-muted);background:var(--surface3);border:1px solid var(--border);padding:2px 8px;border-radius:var(--radius-pill);}
.due-chip svg{width:9px;height:9px;stroke-width:1.5;}
.due-late{color:#ff7070;background:rgba(255,80,80,0.1);border-color:rgba(255,80,80,0.2);}
.due-soon{color:#ffb340;background:rgba(255,147,64,0.1);border-color:rgba(255,147,64,0.2);}

/* pausa badge */
.pausa-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#ff9340;background:rgba(255,147,64,0.1);border:1px solid rgba(255,147,64,0.25);padding:2px 8px;border-radius:var(--radius-pill);margin-top:7px;width:100%;}
.pausa-badge svg{width:10px;height:10px;stroke-width:1.5;flex-shrink:0;}
.pausa-badge-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}

/* card links */
.card-links{display:flex;flex-direction:column;gap:0;margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
.card-link-row{display:flex;align-items:center;gap:6px;padding:4px 0;}
.card-link-row+.card-link-row{border-top:1px solid var(--border);}
.link-icon{width:14px;height:14px;flex-shrink:0;opacity:0.6;}
.link-label{font-size:10px;color:var(--fg-muted);letter-spacing:0.04em;text-transform:uppercase;font-weight:500;flex-shrink:0;min-width:34px;}
.link-anchor{font-size:10px;color:var(--blue-300);text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;transition:color var(--fast);}
.link-anchor:hover{color:var(--cyan-400);}

.empty-col{text-align:center;padding:22px 10px;color:var(--fg-muted);font-size:11px;letter-spacing:0.04em;border:1px dashed var(--border);border-radius:var(--radius-lg);}
.col-drop-active .col-body{outline:1.5px dashed rgba(47,212,232,0.4);outline-offset:-2px;border-radius:var(--radius-md);}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(5,8,15,0.88);backdrop-filter:blur(10px);z-index:500;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-xl);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;}
.modal-header{padding:20px 22px 0;flex-shrink:0;}
.modal-header h2{font-size:14px;font-weight:400;color:var(--fg-1);letter-spacing:-0.01em;}

.modal-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-top:16px;overflow-x:auto;}
.modal-tab{padding:10px 16px;font-family:inherit;font-size:11px;font-weight:400;color:var(--fg-muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:0.04em;transition:all var(--fast) var(--ease);display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;}
.modal-tab svg{width:12px;height:12px;stroke-width:1.5;}
.modal-tab:hover{color:var(--fg-2);}
.modal-tab.active{color:var(--fg-1);border-bottom-color:var(--blue-500);}
.modal-tab.tab-pausa.active{color:#ff9340;border-bottom-color:#ff9340;}
.modal-tab.tab-obs.active{color:#a78bfa;border-bottom-color:#a78bfa;}

.modal-panel{display:none;padding:18px 22px 22px;}
.modal-panel.active{display:block;}

.modal-close-row{display:flex;justify-content:flex-end;margin-bottom:4px;}
.modal-close{background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-2);transition:all var(--fast);}
.modal-close svg{width:12px;height:12px;stroke-width:1.5;}
.modal-close:hover{background:var(--border2);color:var(--fg-1);}

.field{margin-bottom:13px;}
.field label{display:block;font-size:10px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 12px;font-family:inherit;font-size:12px;font-weight:300;color:var(--fg-1);outline:none;transition:border-color var(--fast) var(--ease);-webkit-appearance:none;}
.field input::placeholder,.field textarea::placeholder{color:var(--fg-muted);}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(46,111,184,0.15);}
.field textarea{resize:vertical;min-height:70px;line-height:1.5;}
.field select option{background:var(--surface3);color:var(--fg-1);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* pausa highlight */
.pausa-field textarea:focus{border-color:#ff9340;box-shadow:0 0 0 3px rgba(255,147,64,0.12);}
.pausa-banner{background:rgba(255,147,64,0.08);border:1px solid rgba(255,147,64,0.2);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;}
.pausa-banner svg{width:16px;height:16px;stroke-width:1.5;color:#ff9340;flex-shrink:0;margin-top:1px;}
.pausa-banner-text{font-size:11px;color:rgba(255,147,64,0.85);line-height:1.5;}

.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 20px;border-top:1px solid var(--border);flex-shrink:0;}
.btn-cancel{background:none;border:1px solid var(--border);border-radius:var(--radius-pill);padding:8px 18px;font-family:inherit;font-size:11px;color:var(--fg-2);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.03em;}
.btn-cancel:hover{border-color:var(--border2);color:var(--fg-1);}
.btn-save{background:var(--blue-500);border:none;border-radius:var(--radius-pill);padding:8px 22px;font-family:inherit;font-size:11px;font-weight:500;color:var(--white);cursor:pointer;transition:all var(--fast) var(--ease);letter-spacing:0.04em;}
.btn-save:hover{background:var(--blue-400);box-shadow:0 0 16px rgba(46,111,184,0.45);}

/* HISTORY */
.history-overlay{display:none;position:fixed;inset:0;z-index:400;}
.history-overlay.open{display:block;}
.history-panel{position:fixed;right:0;top:0;bottom:0;width:310px;background:var(--surface2);border-left:1px solid var(--border2);display:flex;flex-direction:column;z-index:401;transform:translateX(100%);transition:transform var(--mid) var(--ease);}
.history-overlay.open .history-panel{transform:translateX(0);}
.history-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.history-header h3{font-size:13px;font-weight:400;color:var(--fg-1);}
.history-body{flex:1;overflow-y:auto;padding:12px 16px;}
.history-body::-webkit-scrollbar{width:3px;}
.history-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.hist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.hist-dot.moved{background:var(--cyan-400);}
.hist-dot.created{background:var(--client-jardim);}
.hist-dot.edited{background:var(--blue-300);}
.hist-dot.deleted{background:#ff5c5c;}
.hist-content{flex:1;}
.hist-msg{font-size:12px;color:var(--fg-2);line-height:1.5;}
.hist-time{font-size:10px;color:var(--fg-muted);margin-top:2px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-pill);padding:8px 18px;font-size:11px;color:var(--fg-1);opacity:0;transition:all var(--mid) var(--ease);pointer-events:none;z-index:999;letter-spacing:0.03em;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* pausado column highlight */
.col-pausado .col-header .col-indicator{box-shadow:0 0 6px rgba(255,147,64,0.4);}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <div class="logo-mark">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25zM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25z"/></svg>
    </div>
    <span class="logo-title">adois</span>
    <div class="logo-sep"></div>
    <span class="logo-sub">casa jardim</span>
  </div>

  <div class="client-tabs">
    <button class="client-tab active" data-client="all" onclick="setClient('all')">todos</button>
    <button class="client-tab" data-client="jardim" onclick="setClient('jardim')">Jardim Cafeteria</button>
    <button class="client-tab" data-client="hey" onclick="setClient('hey')">Hey! Burgers</button>
  </div>

  <div class="topbar-actions">
    <button class="btn-history" onclick="toggleHistory()" title="historico">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
    </button>
    <button class="btn-novo" onclick="openModal()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      novo job
    </button>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <button class="filter-pill fp-all active" data-type="all" onclick="setType('all')">todos</button>
  <button class="filter-pill fp-reels" data-type="reels" onclick="setType('reels')">reels</button>
  <button class="filter-pill fp-foto" data-type="foto" onclick="setType('foto')">foto</button>
  <div class="filter-sep"></div>
  <span class="filter-count" id="filter-count"></span>
  <input class="search-input" id="search-input" type="text" placeholder="buscar job..." oninput="applyFilters()" />
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat"><span class="stat-label">total</span><span class="stat-val" id="stat-total">0</span></div>
  <div class="stat-sep"></div>
  <div class="stat"><span class="stat-label">em producao</span><span class="stat-val" id="stat-producao" style="color:var(--cyan-400)">0</span></div>
  <div class="stat-sep"></div>

    <!-- PANEL: INFO -->

        <span class="pausa-banner-text">Este job esta pausado. Descreva o motivo para o cliente entender o que esta acontecendo.</span>
      </div>

        <label>motivo da pausa</label>
        <textarea id="f-pausa" style="min-height:140px;" placeholder="Ex: Aguardando aprovacao do briefing pelo cliente, material de captacao pendente, aguardando feedback..."></textarea>

<script>
var COLS=[
  {id:'futuro',     label:'Futuro',                color:'#6B7CDB'},
  {id:'producao',   label:'Em producao',            color:'#2FD4E8'},
  {id:'pausado',    label:'Pausado',                color:'#FF9340'},
  {id:'grafica',    label:'Na grafica',             color:'#B9D7EE'},
  {id:'sol_ajuste', label:'Solicitacao de ajuste',  color:'#F59E0B'},
  {id:'ag_ajuste',  label:'Aguardando ajuste',      color:'#A78BFA'},
  {id:'concluido',  label:'Concluido',              color:'#4DCC8A'},
];
var CLIENTS={
  jardim:{label:'Jardim',cls:'tag-client-jardim'},
  hey:{label:'Hey!',cls:'tag-client-hey'},
};

var _sb=supabase.createClient(
  'https://sonnjdqoaeufsxrvpnqa.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvbm5qZHFvYWV1ZnN4cnZwbnFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTgxOTksImV4cCI6MjA5NTYzNDE5OX0.uRmX8jLkkB87Pqx3t3x93MMn7uvtSDK4USG8Vz9XFMI'
);

function _rowToCard(r){
  return{
    id:r.id,title:r.title,tipo:r.tipo||'reels',client:r.client||'jardim',
    col:r.col||'futuro',due:r.due||'',drive:r.drive||'',
    pausa:r.pausa||'',obs:r.obs||''
  };
}
function _cardToRow(c){
  return{id:c.id,title:c.title,tipo:c.tipo,client:c.client,col:c.col,due:c.due,drive:c.drive,pausa:c.pausa,obs:c.obs};
}

var cards=[];
var hist=[];
var editingId=null,dragId=null;
var activeClient='all',activeType='all',searchQ='';
var modalTipo='reels';

function addHist(type,msg){
  var ts=Date.now();
  hist.unshift({type:type,msg:msg,time:ts});
  if(hist.length>150)hist=hist.slice(0,120);
  _sb.from('cj_hist').insert({type:type,msg:msg,ts:ts}).then(function(){});
}

async function loadData(){
  var res=await _sb.from('cj_cards').select('*');
  var hres=await _sb.from('cj_hist').select('*').order('id',{ascending:false}).limit(150);
  cards=(res.data||[]).map(_rowToCard);
  hist=(hres.data||[]).map(function(h){return{type:h.type,msg:h.msg,time:h.ts};});
  renderBoard();
  _sb.channel('cj-kanban-rt').on('postgres_changes',{event:'*',schema:'public',table:'cj_cards'},function(payload){
    if(payload.eventType==='INSERT'||payload.eventType==='UPDATE'){
      var nc=_rowToCard(payload.new);
      var idx=cards.findIndex(function(c){return c.id===nc.id;});
      if(idx>=0)cards[idx]=nc; else cards.push(nc);
    } else if(payload.eventType==='DELETE'){
      cards=cards.filter(function(c){return c.id!==payload.old.id;});
    }
    renderBoard();
  }).subscribe();
}

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(function(){t.classList.remove('show');},2200);}
function fmtDate(d){if(!d)return null;var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function dueStatus(d){
  if(!d)return'';
  var dl=new Date(d+'T23:59');var now=new Date();var diff=(dl-now)/3600000;
  if(diff<0)return'late';if(diff<24)return'soon';return'ok';
}
function relTime(ts){
  var diff=Math.round((Date.now()-ts)/1000);
  if(diff<60)return'agora';if(diff<3600)return Math.round(diff/60)+'min atras';
  if(diff<86400)return Math.round(diff/3600)+'h atras';return Math.round(diff/86400)+'d atras';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function truncUrl(u){try{var p=new URL(u);return(p.hostname+p.pathname).replace(/\/$/,'').substring(0,32)+'...';}catch(e){return String(u).substring(0,32)+'...';}}

function toggleTipo(t){
  if(modalTipo===t&&modalTipo!=='both'){modalTipo=t;}
  else if(modalTipo==='both'){modalTipo=(t==='reels')?'foto':'reels';}
  else if(modalTipo!==t){modalTipo='both';}
  else{modalTipo=t;}
  renderTipoToggle();
}
function renderTipoToggle(){
  var br=document.getElementById('btn-reels');
  var bf=document.getElementById('btn-foto');
  br.className='tipo-btn'+((modalTipo==='reels'||modalTipo==='both')?' active-reels':'');
  bf.className='tipo-btn'+((modalTipo==='foto'||modalTipo==='both')?' active-foto':'');
}
function tipoLabel(t){if(t==='reels')return'Reels';if(t==='foto')return'Foto';if(t==='both')return'Reels + Foto';return'';}
function tipoCls(t){if(t==='reels')return'tag-reels';if(t==='foto')return'tag-foto';return'tag-both';}

function switchTab(tab){
  ['info','pausa','obs'].forEach(function(id){
    document.getElementById('tab-'+id).classList.toggle('active',id===tab);
    document.getElementById('panel-'+id).classList.toggle('active',id===tab);
  });
}

function onColChange(){
  var col=document.getElementById('f-col').value;
  var badge=document.getElementById('pausa-badge');
  var banner=document.getElementById('pausa-banner');
  if(col==='pausado'){
    badge.style.display='inline';
    banner.style.display='flex';
  } else {
    badge.style.display='none';
    banner.style.display='none';
  }
}

function cardVisible(card){
  if(activeClient!=='all'&&card.client!==activeClient)return false;
  if(activeType==='reels'&&card.tipo!=='reels'&&card.tipo!=='both')return false;
  if(activeType==='foto'&&card.tipo!=='foto'&&card.tipo!=='both')return false;
  if(searchQ){
    var q=searchQ.toLowerCase();
    var hay=(card.title+' '+(card.client||'')).toLowerCase();
    if(hay.indexOf(q)===-1)return false;
  }
  return true;
}
function setClient(c){
  activeClient=c;
  document.querySelectorAll('.client-tab').forEach(function(b){b.classList.toggle('active',b.dataset.client===c);});
  applyFilters();
}
function setType(t){
  activeType=t;
  document.querySelectorAll('.filter-pill').forEach(function(b){b.classList.toggle('active',b.dataset.type===t);});
  applyFilters();
}
function applyFilters(){
  searchQ=document.getElementById('search-input').value.trim();
  var vis=0;
  cards.forEach(function(c){
    var el=document.querySelector('.card[data-id="'+c.id+'"]');
    if(el){var show=cardVisible(c);el.classList.toggle('hidden',!show);if(show)vis++;}
  });
  document.getElementById('filter-count').textContent=vis+' job'+(vis!==1?'s':'');
  updateStats();updateColCounts();
}
function updateColCounts(){
  COLS.forEach(function(col){
    var count=cards.filter(function(c){return c.col===col.id&&cardVisible(c);}).length;
    var el=document.querySelector('#col-count-'+col.id);
    if(el)el.textContent=count;
    var body=document.getElementById('cb-'+col.id);
    if(body){
      var emp=body.querySelector('.empty-col');
      if(count===0&&!emp){var d=document.createElement('div');d.className='empty-col';d.textContent='nenhum job';body.appendChild(d);}
      else if(count>0&&emp)emp.remove();
    }
  });
}
function updateStats(){
  var vis=cards.filter(cardVisible);
  document.getElementById('stat-total').textContent=vis.length;
  document.getElementById('stat-producao').textContent=vis.filter(function(c){return c.col==='producao';}).length;
  document.getElementById('stat-pausado').textContent=vis.filter(function(c){return c.col==='pausado';}).length;
  document.getElementById('stat-concluido').textContent=vis.filter(function(c){return c.col==='concluido';}).length;
  document.getElementById('stat-ajuste').textContent=vis.filter(function(c){return c.col==='sol_ajuste'||c.col==='ag_ajuste';}).length;
}

function renderBoard(){
  var board=document.getElementById('board');board.innerHTML='';
  COLS.forEach(function(col){
    var colCards=cards.filter(function(c){return c.col===col.id;});
    var wrap=document.createElement('div');
    wrap.className='column'+(col.id==='pausado'?' col-pausado':'');
    wrap.innerHTML='<div class="col-header"><div class="col-indicator" style="background:'+col.color+'"></div><span class="col-label">'+col.label+'</span><span class="col-count" id="col-count-'+col.id+'">'+colCards.length+'</span></div><div class="col-body" id="cb-'+col.id+'"></div>';
    board.appendChild(wrap);
    var body=wrap.querySelector('.col-body');
    setupDrop(body,col.id,wrap);
    colCards.forEach(function(card){body.appendChild(buildCard(card,col.color));});
    if(colCards.length===0){var d=document.createElement('div');d.className='empty-col';d.textContent='nenhum job';body.appendChild(d);}
  });
  applyFilters();
}

function buildCard(card,colColor){
  var el=document.createElement('div');
  el.className='card';el.draggable=true;el.dataset.id=card.id;
  el.style.setProperty('--col-color',colColor);
  var cli=CLIENTS[card.client||'jardim']||CLIENTS.jardim;
  var tipo=card.tipo||'reels';
  var ds=dueStatus(card.due);

  var dueHtml='';
  if(card.due){
    var dc=ds==='late'?' due-late':ds==='soon'?' due-soon':'';
    dueHtml='<span class="due-chip'+dc+'"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>'+fmtDate(card.due)+'</span>';
  }

  var linksHtml='';
  if(card.drive){
    linksHtml='<div class="card-links"><div class="card-link-row">'
      +'<svg class="link-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg>'
      +'<span class="link-label">drive</span>'
      +'<a class="link-anchor" href="'+esc(card.drive)+'" target="_blank" rel="noopener">'+esc(truncUrl(card.drive))+'</a>'
      +'</div></div>';
  }

  var pausaHtml='';
  if(card.col==='pausado'&&card.pausa){
    pausaHtml='<div class="pausa-badge"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5"/></svg><span class="pausa-badge-text">'+esc(card.pausa)+'</span></div>';
  }

  el.innerHTML='<div class="card-top"><div class="card-title">'+esc(card.title)+'</div>'
    +'<div class="card-actions">'
    +'<button class="icon-btn" onclick="openModal(\''+card.id+'\')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897z"/></svg></button>'
    +'<button class="icon-btn danger" onclick="delCard(\''+card.id+'\')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg></button>'
    +'</div></div>'
    +'<div class="card-meta"><span class="tag '+cli.cls+'">'+cli.label+'</span><span class="tag '+tipoCls(tipo)+'">'+tipoLabel(tipo)+'</span>'
    +dueHtml+'</div>'
    +pausaHtml
    +linksHtml;

  el.addEventListener('dragstart',function(e){dragId=card.id;setTimeout(function(){el.style.opacity='0.4';},0);e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',function(){el.style.opacity='';dragId=null;});
  return el;
}

function setupDrop(body,colId,wrap){
  body.addEventListener('dragover',function(e){e.preventDefault();wrap.classList.add('col-drop-active');});
  body.addEventListener('dragleave',function(e){if(!wrap.contains(e.relatedTarget))wrap.classList.remove('col-drop-active');});
  body.addEventListener('drop',function(e){
    e.preventDefault();wrap.classList.remove('col-drop-active');
    if(dragId){
      var c=cards.find(function(x){return x.id===dragId;});
      if(c&&c.col!==colId){
        var cl=COLS.find(function(x){return x.id===colId;});
        c.col=colId;
        _sb.from('cj_cards').upsert(_cardToRow(c)).then(function(){});
        addHist('moved','['+esc(c.title)+'] movido para '+cl.label);
        renderBoard();toast('job movido');
      }
    }
  });
}

function openModal(id){
  editingId=id||null;
  var colSel=document.getElementById('f-col');
  colSel.innerHTML=COLS.map(function(c){return'<option value="'+c.id+'">'+c.label+'</option>';}).join('');
  if(id){
    var card=cards.find(function(c){return c.id===id;});
    document.getElementById('modal-title').textContent='editar job';
    document.getElementById('f-title').value=card.title||'';
    document.getElementById('f-client').value=card.client||'jardim';
    document.getElementById('f-col').value=card.col||'futuro';
    document.getElementById('f-due').value=card.due||'';
    document.getElementById('f-drive').value=card.drive||'';
    document.getElementById('f-pausa').value=card.pausa||'';
    document.getElementById('f-obs').value=card.obs||'';
    modalTipo=card.tipo||'reels';
  } else {
    document.getElementById('modal-title').textContent='novo job';
    ['f-title','f-due','f-drive','f-pausa','f-obs'].forEach(function(i){document.getElementById(i).value='';});
    document.getElementById('f-client').value=activeClient!=='all'?activeClient:'jardim';
    document.getElementById('f-col').value='futuro';
    modalTipo='reels';
  }
  renderTipoToggle();
  onColChange();
  switchTab('info');
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){document.getElementById('f-title').focus();},60);
}
function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}

function saveCard(){
  var title=document.getElementById('f-title').value.trim();
  if(!title){switchTab('info');document.getElementById('f-title').focus();return;}
  var data={
    title:title,
    tipo:modalTipo,
    client:document.getElementById('f-client').value,
    col:document.getElementById('f-col').value,
    due:document.getElementById('f-due').value,
    drive:document.getElementById('f-drive').value.trim(),
    pausa:document.getElementById('f-pausa').value.trim(),
    obs:document.getElementById('f-obs').value.trim(),
  };
  if(editingId){
    var i=cards.findIndex(function(c){return c.id===editingId;});
    if(i>=0){cards[i]=Object.assign({},cards[i],data);_sb.from('cj_cards').upsert(_cardToRow(cards[i])).then(function(){});}
    addHist('edited','['+esc(title)+'] editado');toast('job atualizado');
  } else {
    var nc=Object.assign({id:Date.now().toString()},data);
    cards.push(nc);
    _sb.from('cj_cards').insert(_cardToRow(nc)).then(function(){});
    addHist('created','['+esc(title)+'] criado');toast('job criado');
  }
  renderBoard();closeModal();
}
function delCard(id){
  if(!confirm('excluir este job?'))return;
  var c=cards.find(function(x){return x.id===id;});
  if(c)addHist('deleted','['+esc(c.title)+'] excluido');
  cards=cards.filter(function(c){return c.id!==id;});
  _sb.from('cj_cards').delete().eq('id',id).then(function(){});
  renderBoard();toast('job removido');
}

function toggleHistory(){document.getElementById('hist-overlay').classList.toggle('open');renderHistory();}
function closeHistory(e){if(e.target===document.getElementById('hist-overlay'))document.getElementById('hist-overlay').classList.remove('open');}
function renderHistory(){
  var body=document.getElementById('hist-body');
  if(!hist.length){body.innerHTML='<div style="font-size:12px;color:var(--fg-muted);padding:12px 0;">nenhuma alteracao ainda</div>';return;}
  body.innerHTML=hist.map(function(h){
    return'<div class="hist-item"><div class="hist-dot '+h.type+'"></div><div class="hist-content"><div class="hist-msg">'+esc(h.msg)+'</div><div class="hist-time">'+relTime(h.time)+'</div></div></div>';
  }).join('');
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
loadData();
</script>
</body>
</html>
